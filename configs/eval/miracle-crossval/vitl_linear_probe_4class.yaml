app: vjepa
cpus_per_task: 32
folder: /system/user/publicwork/fallmann/miracle/EchoJEPA/experiments/crossval/vitl_linear_probe_4class
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 1
num_workers: 8

eval_name: video_classification_frozen_crossval
resume_checkpoint: true
tag: vitl_linear_probe_4class

experiment:
  classifier:
    task_type: classification
    probe_type: linear          # NEW: Specify probe type
    use_layernorm: true
    dropout: 0.0

  data:
    dataset_type: VideoDataset
    # Update these paths for your view classification data
    # For sample efficiency: create _1pct.csv, _10pct.csv variants
    dataset_crossval: /system/user/publicwork/fallmann/miracle/miracle/data/cv/dataset_4class_5fold.csv

    num_classes: 4             # Or whatever your view count is
    resolution: 224
    frames_per_clip: 32
    frame_step: 1
    num_segments: 4
    num_views_per_segment: 1

  optimization:
    batch_size: 10
    num_epochs: 12
    inner_num_epochs: 10
    use_bfloat16: true
    use_pos_embed: false

    # LINEAR PROBE CLASSIFICATION GRID
    multihead_kwargs:
    # --- Group 1: 1e-2 (Higher LR for linear) ---
    - final_lr: 0.0
      final_weight_decay: 0.0
      lr: 0.01
      start_lr: 0.01
      warmup: 0.0
      weight_decay: 0.0
    - final_lr: 0.0
      final_weight_decay: 0.0001
      lr: 0.01
      start_lr: 0.01
      warmup: 0.0
      weight_decay: 0.0001
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.01
      start_lr: 0.01
      warmup: 0.0
      weight_decay: 0.01

    # --- Group 2: 5e-3 ---
    - final_lr: 0.0
      final_weight_decay: 0.0
      lr: 0.005
      start_lr: 0.005
      warmup: 0.0
      weight_decay: 0.0
    - final_lr: 0.0
      final_weight_decay: 0.0001
      lr: 0.005
      start_lr: 0.005
      warmup: 0.0
      weight_decay: 0.0001
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.005
      start_lr: 0.005
      warmup: 0.0
      weight_decay: 0.01

    # --- Group 3: 1e-3 (Overlap with your old grid) ---
    - final_lr: 0.0
      final_weight_decay: 0.0
      lr: 0.001
      start_lr: 0.001
      warmup: 0.0
      weight_decay: 0.0
    - final_lr: 0.0
      final_weight_decay: 0.0001
      lr: 0.001
      start_lr: 0.001
      warmup: 0.0
      weight_decay: 0.0001
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.001
      start_lr: 0.001
      warmup: 0.0
      weight_decay: 0.01

model_kwargs:
  checkpoint: "/system/user/publicwork/fallmann/miracle/EchoJEPA/checkpoints/echojepa_vitl.pt"
  module_name: evals.video_classification_frozen.modelcustom.vit_encoder_multiclip

  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      img_temporal_dim_size: null
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true

  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false