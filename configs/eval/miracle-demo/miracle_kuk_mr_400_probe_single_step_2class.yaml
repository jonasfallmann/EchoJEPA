app: vjepa
cpus_per_task: 32
folder: /system/user/publicwork/fallmann/miracle/EchoJEPA/experiments/kuk_mr_400_single_step-2class
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 1
num_workers: 8

eval_name: video_classification_frozen
resume_checkpoint: true
tag: kuk-mr-400-attentive_probe-224-single_step-2class

experiment:
  classifier:
    task_type: classification
    probe_type: attentive          # NEW: Specify probe type
    num_heads: 16               # Ignored for linear probe
    num_probe_blocks: 4         # Ignored for linear probe

  data:
    dataset_type: VideoDataset
    # Update these paths for your view classification data
    # For sample efficiency: create _1pct.csv, _10pct.csv variants
    dataset_train: /system/user/publicwork/fallmann/miracle/EchoJEPA/experiments/kuk_mr_400/train_2class.csv
    dataset_val:   /system/user/publicwork/fallmann/miracle/EchoJEPA/experiments/kuk_mr_400/val_2class.csv

    num_classes: 2             # Or whatever your view count is
    resolution: 224
    frames_per_clip: 32
    frame_step: 1
    num_segments: 4
    num_views_per_segment: 1

  optimization:
    batch_size: 8
    num_epochs: 20
    use_bfloat16: true
    use_pos_embed: false

    # LINEAR PROBE CLASSIFICATION GRID
    multihead_kwargs:
    # --- Group 1: 1e-3 ---
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.001
      start_lr: 0.001
      warmup: 0.0
      weight_decay: 0.01
    - final_lr: 0.0
      final_weight_decay: 0.1
      lr: 0.001
      start_lr: 0.001
      warmup: 0.0
      weight_decay: 0.1
    - final_lr: 0.0
      final_weight_decay: 0.4
      lr: 0.001
      start_lr: 0.001
      warmup: 0.0
      weight_decay: 0.4

    # --- Group 2: 5e-4 ---
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.0005
      start_lr: 0.0005
      warmup: 0.0
      weight_decay: 0.01
    - final_lr: 0.0
      final_weight_decay: 0.1
      lr: 0.0005
      start_lr: 0.0005
      warmup: 0.0
      weight_decay: 0.1
    - final_lr: 0.0
      final_weight_decay: 0.4
      lr: 0.0005
      start_lr: 0.0005
      warmup: 0.0
      weight_decay: 0.4

    # --- Group 3: 1e-4 ---
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.0001
      start_lr: 0.0001
      warmup: 0.0
      weight_decay: 0.01
    - final_lr: 0.0
      final_weight_decay: 0.1
      lr: 0.0001
      start_lr: 0.0001
      warmup: 0.0
      weight_decay: 0.1
    - final_lr: 0.0
      final_weight_decay: 0.4
      lr: 0.0001
      start_lr: 0.0001
      warmup: 0.0
      weight_decay: 0.4

model_kwargs:
  checkpoint: "/system/user/publicwork/fallmann/miracle/EchoJEPA/checkpoints/echojepa_vitg.pt"
  module_name: evals.video_classification_frozen.modelcustom.vit_encoder_multiclip

  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      img_temporal_dim_size: null
      model_name: vit_giant_xformers
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true

  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false