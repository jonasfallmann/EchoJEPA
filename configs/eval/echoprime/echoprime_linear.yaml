app: vjepa
cpus_per_task: 32
folder: /system/user/publicwork/fallmann/miracle/EchoJEPA/experiments/echoprime_linear
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 1
num_workers: 8

eval_name: video_classification_frozen
resume_checkpoint: true
tag: echoprime-linear_probe-224

experiment:
  classifier:
    task_type: classification
    probe_type: linear          # NEW: Specify probe type
    dropout: 0.0
    use_layernorm: true

  data:
    dataset_type: VideoDataset
    # Update these paths for your view classification data
    # For sample efficiency: create _1pct.csv, _10pct.csv variants
    dataset_train: /system/user/publicwork/fallmann/miracle/EchoJEPA/experiments/kuk_mr_400/server_echojepa_ptid/train_val_4class.csv
    dataset_val:   /system/user/publicwork/fallmann/miracle/EchoJEPA/experiments/kuk_mr_400/server_echojepa_ptid/test_4class.csv

    num_classes: 4             # Or whatever your view count is
    resolution: 224
    frames_per_clip: 16
    frame_step: 1
    num_segments: 8
    num_views_per_segment: 1

  optimization:
    batch_size: 12
    num_epochs: 20
    use_bfloat16: true
    use_pos_embed: false

    multihead_kwargs:
      # --- Group 1: 1e-2 (Higher LR for linear) ---
      - final_lr: 0.0
        final_weight_decay: 0.0
        lr: 0.01
        start_lr: 0.01
        warmup: 0.0
        weight_decay: 0.0
      - final_lr: 0.0
        final_weight_decay: 0.0001
        lr: 0.01
        start_lr: 0.01
        warmup: 0.0
        weight_decay: 0.0001
      - final_lr: 0.0
        final_weight_decay: 0.01
        lr: 0.01
        start_lr: 0.01
        warmup: 0.0
        weight_decay: 0.01

      # --- Group 2: 5e-3 ---
      - final_lr: 0.0
        final_weight_decay: 0.0
        lr: 0.005
        start_lr: 0.005
        warmup: 0.0
        weight_decay: 0.0
      - final_lr: 0.0
        final_weight_decay: 0.0001
        lr: 0.005
        start_lr: 0.005
        warmup: 0.0
        weight_decay: 0.0001
      - final_lr: 0.0
        final_weight_decay: 0.01
        lr: 0.005
        start_lr: 0.005
        warmup: 0.0
        weight_decay: 0.01

      # --- Group 3: 1e-3 (Overlap with your old grid) ---
      - final_lr: 0.0
        final_weight_decay: 0.0
        lr: 0.001
        start_lr: 0.001
        warmup: 0.0
        weight_decay: 0.0
      - final_lr: 0.0
        final_weight_decay: 0.0001
        lr: 0.001
        start_lr: 0.001
        warmup: 0.0
        weight_decay: 0.0001
      - final_lr: 0.0
        final_weight_decay: 0.01
        lr: 0.001
        start_lr: 0.001
        warmup: 0.0
        weight_decay: 0.01

model_kwargs:
  module_name: evals.video_classification_frozen.modelcustom.echo_prime_encoder

  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      img_temporal_dim_size: null
      model_name: vit_giant_xformers
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true

  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false